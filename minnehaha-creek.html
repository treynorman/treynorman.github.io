<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minnehaha Creek @ Hiawatha Ave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bone: #f1ede2;
    --paper: #faf8f1;
    --ink: #0c0c0b;
    --ink-2: #2a2a26;
    --mute: #8a857a;
    --hazard: #ff4a17;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --display: 'Space Grotesk', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: var(--display);
    background: var(--bone);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    background:
      repeating-linear-gradient(
        45deg,
        transparent 0,
        transparent 22px,
        rgba(12,12,11,0.04) 22px,
        rgba(12,12,11,0.04) 23px
      ),
      var(--bone);
    border-bottom: 2px solid var(--ink);
  }

  .hero-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 28px 40px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 0 0 18px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: -0.015em;
    margin: 0 0 8px;
  }

  .subtitle {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--mute);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }

  .grid-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 28px 80px;
  }

  /* ── Metric cards ── */

  .card-frame {
    border: 2px solid var(--ink);
    background: var(--paper);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  @media (max-width: 600px) {
    .card-frame { grid-template-columns: 1fr; }
  }

  .metric-card {
    padding: 40px 32px;
    border-right: 2px solid var(--ink);
  }

  @media (max-width: 600px) {
    .metric-card { border-right: none; }
  }

  .metric-card:nth-child(2) { border-right: none; }
  .metric-card:nth-child(3),
  .metric-card:nth-child(4) { border-bottom: none; }

  @media (max-width: 600px) {
    .metric-card:last-child { border-bottom: none; }
  }

  .metric-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 16px;
  }

  .metric-value {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(48px, 8vw, 72px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .metric-unit {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 400;
    color: var(--mute);
    margin-left: 6px;
  }

  .metric-time {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--mute);
    margin-top: 12px;
  }

  /* ── Footer ── */

  .foot {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 24px 28px;
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .foot a {
    color: var(--bone);
    border-bottom: 1.5px solid var(--bone);
  }

  /* ── Error state ── */

  .error-msg {
    color: var(--hazard);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <p class="eyebrow">USGS Real-Time Data</p>
    <h1>Minnehaha Creek<br>@ Hiawatha Ave</h1>
    <p class="subtitle">Gauge Station 05289800 — Minneapolis, MN</p>
  </div>
</div>

<div class="grid-wrap">
  <div class="card-frame">
    <div class="metric-card" id="gh-card">
      <div class="metric-label">Gage Height</div>
      <div class="metric-value"><span id="gh-val">—</span><span class="metric-unit">ft</span></div>
      <div class="metric-time" id="gh-ts"></div>
    </div>
    <div class="metric-card" id="fr-card">
      <div class="metric-label">Flow Rate</div>
      <div class="metric-value"><span id="fr-val">—</span><span class="metric-unit">cfs</span></div>
      <div class="metric-time" id="fr-ts"></div>
    </div>
  </div>
</div>

<div class="foot">
  <span>Data: USGS NWIS — waterservices.usgs.gov</span>
  <a href="https://waterdata.usgs.gov/monitoring-location/05289800/">Full history →</a>
</div>

<script>
  const SITE = '05289800';
  const URL = `https://waterservices.usgs.gov/nwis/iv/?sites=${SITE}&parameterCd=00060,00065&siteStatus=all`;

  async function fetchUSGS() {
    const res = await fetch(URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  }

  function parse(xmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'application/xml');
    const series = doc.querySelectorAll('timeSeries');
    const result = {};
    for (const ts of series) {
      const code = ts.querySelector('variableCode').textContent;
      const valEl = ts.querySelector('value');
      const dateTime = valEl.getAttribute('dateTime');
      const qualifiers = valEl.getAttribute('qualifiers') || '';
      result[code] = {
        value: parseFloat(valEl.textContent),
        dateTime,
        provisional: qualifiers.includes('P')
      };
    }
    return result;
  }

  function setMetric(valueElId, tsId, value) {
    const valEl = document.getElementById(valueElId);
    if (isNaN(value)) {
      valEl.innerHTML = '<span class="error-msg">No data</span>';
      return;
    }
    const display = Number.isInteger(value) ? value : value.toFixed(2);
    valEl.textContent = display;
  }

  function setTime(tsId, iso) {
    const el = document.getElementById(tsId);
    if (!iso) { el.textContent = ''; return; }
    const d = new Date(iso);
    const tz = d.toLocaleString('en-US', { timeZoneName: 'short' });
    el.textContent = `Updated: ${tz}`;
  }

  async function main() {
    try {
      const xml = await fetchUSGS();
      const parsed = parse(xml);

      if (parsed['00065']) {
        setMetric('gh-val', null, parsed['00065'].value);
        setTime('gh-ts', parsed['00065'].dateTime);
      } else {
        document.getElementById('gh-val').innerHTML = '<span class="error-msg">No data</span>';
      }

      if (parsed['00060']) {
        setMetric('fr-val', null, parsed['00060'].value);
        setTime('fr-ts', parsed['00060'].dateTime);
      } else {
        document.getElementById('fr-val').innerHTML = '<span class="error-msg">No data</span>';
      }

    } catch (err) {
      const msg = '<span class="error-msg">Fetch failed</span>';
      document.getElementById('gh-val').innerHTML = msg;
      document.getElementById('fr-val').innerHTML = msg;
      console.error(err);
    }
  }

  main();
</script>
</body>
</html>
